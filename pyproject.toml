[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choola"
version = "0.10.0"
description = "A workflow engine for VS Code developers — build, run, and automate workflows with Python nodes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49.0",
    "click>=8.1",
    "flask>=3.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
    "aiofiles>=23.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "cryptography>=42.0",
    "chromadb>=0.5",
    "flask-sock>=0.7",
    "xgboost>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
choola = "choola.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["choola*"]

[tool.setuptools.package-data]
choola = [
    "static/**/*",
    "_claude/**/*",
    "_claude/.gitignore",
    "CLAUDE.md",
    "llms.txt",
]
